<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李導演 | 影視作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #1e2937;
            color: #e2e8f0;
            transition: background-color 0.4s, color 0.4s; /* 🎬 動態細節：讓切換顏色時有柔和的漸變效果，不會太刺眼 */
        }
        
        header {
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
        }
        
        .subtitle {
            font-size: 1.3rem;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        section {
            margin-bottom: 60px;
        }
        
        h2 {
            font-size: 2rem;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .works {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }
        
        .work-card {
            background-color: #334155;
            border-radius: 12px;
            width: 300px;
            overflow: hidden;
            transition: transform 0.3s, background-color 0.4s;
        }
        
        .work-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }
        
        .work-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .work-info {
            padding: 20px;
        }
        
        button {
            display: block;
            margin: 30px auto;
            padding: 14px 32px;
            font-size: 18px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        
        button:hover {
            background-color: #2563eb;
        }
        button:active {
            transform: scale(0.95);
        }

        /* ☀️ 亮色模式（Light Mode）皮膚設定 */
        body.light-mode {
            background-color: #f8fafc; /* 背景變成明亮的灰白色 */
            color: #0f172a; /* 文字變成深色 */
        }

        body.light-mode .work-card {
            background-color: #ffffff; /* 卡片變成白色 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); /* 亮色底用淡陰影 */
        }
        
        body.light-mode button {
            background-color: #0f172a; /* 亮色底時，大按鈕變成帥氣的深黑色 */
            color: white;
        }

        body.light-mode button:hover {
            background-color: #334155;
        }

        /* 📱 當螢幕寬度小於或等於 768 像素時的手機 RWD 設定 */
        @media (max-width: 768px) {
            header {
                padding: 50px 15px 40px;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .container {
                padding: 20px 15px;
            }

            h2 {
                font-size: 1.6rem;
            }

            .work-card {
                width: 100%;
                max-width: 340px;
            }
            
            #load-btn {
                width: 80%;
                font-size: 16px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <!-- 頂部主題切換按鈕區塊 -->
    <div style="text-align: right; padding: 15px 20px; max-width: 1000px; margin: 0 auto;">
        <button id="theme-btn" onclick="toggleTheme()" style="margin: 0; padding: 8px 18px; font-size: 14px;">☀️ 變亮色</button>
    </div>

    <header>
        <h1>🎬 30歲導演 × 未來前端工程師</h1>
        <p class="subtitle">從影視故事 到 數位體驗</p>
    </header>

    <div class="container">
        <section>
            <h2>關於我</h2>
            <p>我是李導演，曾擔任影視導演與編劇。代表作品包括《情繫煙火夢》、《蜜瓜》、《接財神》。現在我正在學習前端開發，希望將故事敘事能力結合到數位產品中。</p>
        </section>

        <section>
            <h2>代表作品</h2>
            <div class="works" id="works-container">
                <div class="work-card">
                    <img src="https://via.placeholder.com/300x180?text=情繫煙火夢" alt="情繫煙火夢">
                    <div class="work-info">
                        <h3>情繫煙火夢</h3>
                        <p>2022 劇情短片</p>
                    </div>
                </div>
                
                <div class="work-card">
                    <img src="https://via.placeholder.com/300x180?text=蜜瓜" alt="蜜瓜">
                    <div class="work-info">
                        <h3>蜜瓜</h3>
                        <p>2023 喜劇</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <button onclick="showMoreWorks()" id="load-btn">看更多作品</button>

    <script>
        // 🎬 1. 看更多作品的功能
        function showMoreWorks() {
            const container = document.getElementById('works-container');
            
            const newCardHTML = `
                <div class="work-card">
                    <img src="https://via.placeholder.com/300x180?text=接財神" alt="接財神">
                    <div class="work-info">
                        <h3>接財神</h3>
                        <p>2024 賀歲喜劇</p>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', newCardHTML);
            
            const button = document.getElementById('load-btn');
            button.style.display = 'none';
        }

        // 🎬 2. 主題切換的導戲開關
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            
            // 彈性切換標籤
            body.classList.toggle('light-mode');
            
            // 判斷當下狀態，優雅更改按鈕文字與圖示
            if (body.classList.contains('light-mode')) {
                themeBtn.innerText = "🌙 變深色";
            } else {
                themeBtn.innerText = "☀️ 變亮色";
            }
        }
    </script>
</body>
</html>
